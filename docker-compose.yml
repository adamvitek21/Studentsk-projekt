version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app:ro
      - /tmp:/tmp
    ports:
      - "8000:8000"
    environment:
      - GTFS_RT_URL=/tmp/feed.pb
      - GTFS_POLL_INTERVAL=10

  frontend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./frontend/src:/app:ro
    ports:
      - "5000:5000"
    command: python3 -m http.server 5000
    depends_on:
      - backend