<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=4096, height=607, initial-scale=1.0, user-scalable=no">
    <title>Metro Praha - Produkční odjezdy</title>
    <link rel="stylesheet" href="css/departures.css">
    <style>
        /* Produkční režim: bez ovládacích prvků */
        * { cursor: none !important; }
        
        /* Fixní velikost pro produkční displej */
        html, body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 4096px;
            height: 607px;
            background: #1a1a1a;
        }
        
        /* Skrytí control panelu */
        .control-panel {
            display: none !important;
        }
        
        /* Fixní velikost departures kontejneru */
        .departures-container {
            width: 4096px !important;
            height: 607px !important;
            min-width: 4096px !important;
            min-height: 607px !important;
            max-width: 4096px !important;
            max-height: 607px !important;
            padding: 20px 40px;
            box-sizing: border-box;
        }
        
        .departures-table {
            height: calc(607px - 120px);
        }
        
        .table-body {
            max-height: calc(607px - 180px);
            overflow: hidden;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 15px;
        }
        
        .station-name {
            color: #00ff88;
            font-size: 32px;
            font-weight: bold;
        }
        
        .station-name-header {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>

        </symbol>
    </svg>

    <div class="departures-container">
        <div class="header">
            <div class="station-info">
                <div class="station-icon">
                    <svg><use href="#icon-stop"/></svg>
                </div>
                <div class="station-name-header">
                    <span class="station-label">Odjezdy ze stanice</span>
                    <span class="station-name" id="station-name">--</span>
                </div>
            </div>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Načítám...</span>
            </div>
            <div class="time" id="clock">--:--:--</div>
        </div>
        <div class="departures-table">
            <div class="table-header">
                <div class="col-type">Typ</div>
                <div class="col-line">Linka</div>
                <div class="col-direction">Směr</div>
                <div class="col-platform">Nást.</div>
                <div class="col-time">Odjezd</div>
                <div class="col-countdown">Za</div>
            </div>
            <div class="table-body" id="departures-list"></div>
        </div>
    </div>

    <script src="js/departures-production.js"></script>
</body>
</html>
