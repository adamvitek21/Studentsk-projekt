<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=4096, height=607, initial-scale=1.0">
    <title>Metro Praha - Tabulka odjezdů</title>
    <link rel="stylesheet" href="css/departures.css">
</head>
<body>
    <!-- SVG Icon Definitions -->
    <svg aria-hidden="true" style="display:none">
        <!-- Metro Icon -->
        <symbol id="icon-metro" viewBox="0 0 24 24">
            <path fill="currentColor" d="M8.5 15c.83 0 1.5-.67 1.5-1.5S9.33 12 8.5 12 7 12.67 7 13.5 7.67 15 8.5 15zm7 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5zM12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2l2-2h4l2 2h2v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zm0 2c3.51 0 4.96.48 5.57 1H6.43c.61-.52 2.06-1 5.57-1zM6 7h12v6H6V7z"/>
        </symbol>
        <!-- Tram Icon -->
        <symbol id="icon-tram" viewBox="0 0 24 24">
            <path fill="currentColor" d="M19 16.94V8.5c0-2.79-2.61-3.4-6.01-3.49l.76-1.51H17V2H7v1.5h4.75l-.76 1.52C7.86 5.11 5 5.73 5 8.5v8.44c0 1.45 1.19 2.66 2.59 2.97L6 21.5v.5h2.23l2-2H14l2 2h2v-.5l-1.59-1.59c1.45-.28 2.59-1.55 2.59-2.97zM8.5 16c-.83 0-1.5-.67-1.5-1.5S7.67 13 8.5 13s1.5.67 1.5 1.5S9.33 16 8.5 16zm7 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM17 11H7V8h10v3z"/>
        </symbol>
        <!-- Bus Icon -->
        <symbol id="icon-bus" viewBox="0 0 24 24">
            <path fill="currentColor" d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM18 11H6V6h12v5z"/>
        </symbol>
        <!-- Train Icon -->
        <symbol id="icon-train" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2l2-2h4l2 2h2v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-6H6V6h5v5zm2 0V6h5v5h-5zm3.5 6c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
        </symbol>
        <!-- Ferry Icon -->
        <symbol id="icon-ferry" viewBox="0 0 24 24">
            <path fill="currentColor" d="M20 21c-1.39 0-2.78-.47-4-1.32-2.44 1.71-5.56 1.71-8 0C6.78 20.53 5.39 21 4 21H2v2h2c1.38 0 2.74-.35 4-.99 2.52 1.29 5.48 1.29 8 0 1.26.65 2.62.99 4 .99h2v-2h-2zM3.95 19H4c1.6 0 3.02-.88 4-2 .98 1.12 2.4 2 4 2s3.02-.88 4-2c.98 1.12 2.4 2 4 2h.05l1.89-6.68c.08-.26.06-.54-.06-.78s-.34-.42-.6-.5L20 10.62V6c0-1.1-.9-2-2-2h-3V1H9v3H6c-1.1 0-2 .9-2 2v4.62l-1.29.42c-.26.08-.48.26-.6.5s-.15.52-.06.78L3.95 19zM6 6h12v3.97L12 8 6 9.97V6z"/>
        </symbol>
        <!-- Stop/Station Icon -->
        <symbol id="icon-stop" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </symbol>
        <!-- Funicular/Cable Icon -->
        <symbol id="icon-funicular" viewBox="0 0 24 24">
            <path fill="currentColor" d="M9.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5.75 8.9L3 23h2.1l1.75-8L9 17v6h2v-7.55L8.95 13.4l.6-3C10.85 12 12.8 13 15 13v-2c-1.85 0-3.45-1-4.35-2.45l-.95-1.6C9.35 6.35 8.7 6 8 6c-.25 0-.5.05-.75.15L2 8.3V13h2V9.65l1.75-.75M13 2v7h3.75L14 21h2.1l2.75-12H23V2H13zm6 6h-4V4h4v4z"/>
        </symbol>
        <!-- Trolleybus Icon -->
        <symbol id="icon-trolleybus" viewBox="0 0 24 24">
            <path fill="currentColor" d="M17 3H7c-1.65 0-3 1.35-3 3v9c0 .88.39 1.67 1 2.22V19c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-1.65-1.35-3-3-3zm-5-1h1v1h-1V2zm-4 0h2v1H8V2zm0 14c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm8 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm1-5H7V7h10v4zm-1.99-9h1v2h-1V2z"/>
        </symbol>
    </svg>

    <div class="departures-container">
        <!-- Header -->
        <div class="header">
            <div class="station-info">
                <div class="station-icon" id="station-icon">
                    <svg><use href="#icon-stop"/></svg>
                </div>
                <div class="station-name-header">
                    <span class="station-label">Odjezdy ze zastávky</span>
                    <span class="station-name" id="station-name">Florenc</span>
                </div>
            </div>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Načítám...</span>
            </div>
            <div class="time" id="clock">14:32:00</div>
        </div>

        <!-- Tabulka odjezdů -->
        <div class="departures-table">
            <div class="table-header">
                <div class="col-type">Typ</div>
                <div class="col-line">Linka</div>
                <div class="col-direction">Směr</div>
                <div class="col-platform">Nást.</div>
                <div class="col-time">Odjezd</div>
                <div class="col-countdown">Za</div>
            </div>
            <div class="table-body" id="departures-list">
                <!-- Odjezdy budou vygenerovány JavaScriptem -->
            </div>
        </div>

        <!-- Vylepšený ovládací panel pro testování -->
        <div class="control-panel">
            <div class="control-section">
                <h3><svg class="section-icon"><use href="#icon-stop"/></svg> Výběr zastávky</h3>
                <div class="control-row">
                    <div class="control-group">
                        <label>Zastávka:</label>
                        <input type="text" id="stop-search" placeholder="Hledat zastávku..." autocomplete="off">
                        <select id="station-select">
                            <option value="">-- Vyberte zastávku --</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Nebo PID ID:</label>
                        <input type="text" id="stop-id-input" placeholder="např. U1040" style="width: 120px;">
                        <button id="load-stop-btn">Načíst</button>
                    </div>
                </div>
            </div>
            
            <div class="control-section">
                <h3><svg class="section-icon"><use href="#icon-bus"/></svg> Filtry</h3>
                <div class="control-row">
                    <div class="control-group">
                        <label>Doprava:</label>
                        <div class="filter-buttons" id="transport-filter">
                            <button class="filter-btn active" data-type="all">Vše</button>
                            <button class="filter-btn" data-type="metro"><svg class="filter-icon"><use href="#icon-metro"/></svg> Metro</button>
                            <button class="filter-btn" data-type="tram"><svg class="filter-icon"><use href="#icon-tram"/></svg> Tram</button>
                            <button class="filter-btn" data-type="bus"><svg class="filter-icon"><use href="#icon-bus"/></svg> Bus</button>
                            <button class="filter-btn" data-type="train"><svg class="filter-icon"><use href="#icon-train"/></svg> Vlak</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Počet:</label>
                        <select id="limit-select">
                            <option value="5">5 odjezdů</option>
                            <option value="10" selected>10 odjezdů</option>
                            <option value="15">15 odjezdů</option>
                            <option value="20">20 odjezdů</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="control-section">
                <h3><svg class="section-icon settings-icon"><use href="#icon-funicular"/></svg> Nastavení</h3>
                <div class="control-row">
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="auto-refresh" checked>
                            Auto-refresh (30s)
                        </label>
                    </div>
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="show-realtime" checked>
                            Zobrazit real-time
                        </label>
                    </div>
                    <button id="refresh-btn" class="primary-btn">
                        <svg class="btn-icon"><use href="#icon-metro"/></svg> Obnovit nyní
                    </button>
                    <button id="fullscreen-btn" class="secondary-btn">⛶ Fullscreen</button>
                </div>
            </div>
            
            <div class="control-section api-info">
                <span id="api-status">API: Čekám na výběr zastávky</span>
                <span id="last-update">Poslední aktualizace: --:--:--</span>
            </div>
        </div>
    </div>

    <script src="js/departures.js"></script>
</body>
</html>
