<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Praha - Výběr soupravy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px;
            background: #262626;
            border-radius: 10px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }
        
        .status-dot.online { background: #4CAF50; }
        .status-dot.offline { background: #f44336; }
        .status-dot.loading { background: #ff9800; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .lines-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .lines-container {
                grid-template-columns: 1fr;
            }
        }
        
        .line-section {
            background: #262626;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid transparent;
        }
        
        .line-section.line-a { border-color: #00A651; }
        .line-section.line-b { border-color: #F7D117; }
        .line-section.line-c { border-color: #EC1C24; }
        
        .line-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }
        
        .line-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        
        .line-a .line-badge { background: #00A651; }
        .line-b .line-badge { background: #F7D117; color: #000; }
        .line-c .line-badge { background: #EC1C24; }
        
        .line-title {
            flex: 1;
        }
        
        .line-name {
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .line-count {
            color: #888;
            font-size: 0.9rem;
        }
        
        .trains-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .train-card {
            background: #333;
            border-radius: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .train-card:hover {
            background: #444;
            transform: translateX(5px);
        }
        
        .train-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .train-id {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.85rem;
            color: #fff;
        }
        
        .train-details {
            font-size: 0.75rem;
            color: #888;
        }
        
        .train-arrow {
            font-size: 1.2rem;
            color: #666;
        }
        
        .train-card:hover .train-arrow {
            color: #fff;
        }
        
        .no-trains {
            text-align: center;
            color: #666;
            padding: 30px;
            font-style: italic;
        }
        
        .refresh-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .refresh-btn:hover {
            background: #45a049;
        }
        
        .refresh-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .last-update {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        
        /* Scrollbar styling */
        .trains-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .trains-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 3px;
        }
        
        .trains-list::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }
        
        .trains-list::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚇 Metro Praha - Výběr soupravy</h1>
        <p class="subtitle">Klikni na soupravu pro zobrazení jejího displeje</p>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="apiStatus"></div>
                <span id="apiStatusText">Načítání...</span>
            </div>
            <div class="status-item">
                <span id="totalTrains">Celkem: --</span>
            </div>
        </div>
        
        <div class="lines-container">
            <div class="line-section line-a">
                <div class="line-header">
                    <div class="line-badge">A</div>
                    <div class="line-title">
                        <div class="line-name">Linka A</div>
                        <div class="line-count" id="countA">0 souprav</div>
                    </div>
                </div>
                <div class="trains-list" id="trainsA">
                    <div class="no-trains">Načítání...</div>
                </div>
            </div>
            
            <div class="line-section line-b">
                <div class="line-header">
                    <div class="line-badge">B</div>
                    <div class="line-title">
                        <div class="line-name">Linka B</div>
                        <div class="line-count" id="countB">0 souprav</div>
                    </div>
                </div>
                <div class="trains-list" id="trainsB">
                    <div class="no-trains">Načítání...</div>
                </div>
            </div>
            
            <div class="line-section line-c">
                <div class="line-header">
                    <div class="line-badge">C</div>
                    <div class="line-title">
                        <div class="line-name">Linka C</div>
                        <div class="line-count" id="countC">0 souprav</div>
                    </div>
                </div>
                <div class="trains-list" id="trainsC">
                    <div class="no-trains">Načítání...</div>
                </div>
            </div>
        </div>
        
        <button class="refresh-btn" id="refreshBtn" onclick="loadVehicles()">🔄 Obnovit seznam</button>
        <div class="last-update" id="lastUpdate"></div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        async function loadVehicles() {
            const btn = document.getElementById('refreshBtn');
            const statusDot = document.getElementById('apiStatus');
            const statusText = document.getElementById('apiStatusText');
            
            btn.disabled = true;
            btn.textContent = '⏳ Načítání...';
            statusDot.className = 'status-dot loading';
            statusText.textContent = 'Načítání...';
            
            try {
                const response = await fetch(`${API_URL}/api/metro/vehicles`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // Update status
                statusDot.className = 'status-dot online';
                statusText.textContent = 'API Online';
                
                // Data jsou v data.vehicles.A, data.vehicles.B, data.vehicles.C
                const vehicles = data.vehicles || {};
                
                // Render trains for each line
                renderTrains('A', vehicles.A || []);
                renderTrains('B', vehicles.B || []);
                renderTrains('C', vehicles.C || []);
                
                // Update total count
                const total = data.total || 0;
                document.getElementById('totalTrains').textContent = `Celkem: ${total} souprav`;
                
                // Update last update time
                document.getElementById('lastUpdate').textContent = 
                    `Poslední aktualizace: ${new Date().toLocaleTimeString('cs-CZ')}`;
                
            } catch (error) {
                console.error('Error loading vehicles:', error);
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'API Offline';
                
                ['A', 'B', 'C'].forEach(line => {
                    document.getElementById(`trains${line}`).innerHTML = 
                        '<div class="no-trains">❌ Nepodařilo se načíst data</div>';
                    document.getElementById(`count${line}`).textContent = '0 souprav';
                });
            }
            
            btn.disabled = false;
            btn.textContent = '🔄 Obnovit seznam';
        }
        
        function renderTrains(line, trains) {
            const container = document.getElementById(`trains${line}`);
            const countEl = document.getElementById(`count${line}`);
            
            countEl.textContent = `${trains.length} souprav`;
            
            if (trains.length === 0) {
                container.innerHTML = '<div class="no-trains">Žádné aktivní soupravy</div>';
                return;
            }
            
            container.innerHTML = trains.map(train => {
                // Parse trip_id to get readable info
                const tripParts = train.trip_id.split('_');
                const tripNum = tripParts[1] || train.trip_id;
                
                return `
                    <div class="train-card" onclick="openTrain('${train.trip_id}', '${line}')">
                        <div class="train-info">
                            <div class="train-id">${train.trip_id}</div>
                            <div class="train-details">
                                Trip: ${tripNum} | 
                                Headsign: ${train.headsign || 'N/A'}
                            </div>
                        </div>
                        <div class="train-arrow">→</div>
                    </div>
                `;
            }).join('');
        }
        
        function openTrain(tripId, line) {
            const url = `metro-train-locked.html?train=${encodeURIComponent(tripId)}&line=${line}&debug=true`;
            window.open(url, '_blank');
        }
        
        // Auto-refresh every 30 seconds
        setInterval(loadVehicles, 30000);
        
        // Initial load
        loadVehicles();
    </script>
</body>
</html>
